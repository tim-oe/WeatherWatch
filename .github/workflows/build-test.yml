name: Build Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          # libgl1 and libglib2.0-0 are required to import the opencv wheel.
          sudo apt-get install -y pkg-config libmariadb-dev build-essential libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          pip install poetry
          # poetry.toml forces an opencv source build for the Pi h264 encoder.
          # The wheel is enough to import cv2 in CI.
          printf '%s\n' '[installer]' > poetry.toml
          # RPi.GPIO ships arm wheels only and will not build on ubuntu-latest.
          sed -i '/^rpi-gpio /d' pyproject.toml
          poetry lock --no-interaction
          poetry install --no-interaction
          # Imported by the AQI reader. Present as a system package on the Pi.
          poetry run pip install 'smbus2==0.4.3'

      - name: Stub Pi-only imports
        run: |
          stub="${RUNNER_TEMP}/pi-stubs"
          mkdir -p "$stub/picamera2"
          # Blinka raises NotImplementedError on import when the host is not a Pi.
          cat > "$stub/board.py" << 'EOF'
          def I2C(*args, **kwargs):
              raise RuntimeError("board.I2C is unavailable in CI")

          SCL = object()
          SDA = object()
          EOF
          cat > "$stub/picamera2/__init__.py" << 'EOF'
          class Preview:
              NULL = None

          class Picamera2:
              @staticmethod
              def set_logging(*args, **kwargs):
                  return None

              @staticmethod
              def load_tuning_file(*args, **kwargs):
                  return None

              def __init__(self, *args, **kwargs):
                  pass
          EOF
          cat > "$stub/picamera2/allocators.py" << 'EOF'
          class PersistentAllocator:
              def __init__(self, *args, **kwargs):
                  pass
          EOF

      - name: Run tests
        env:
          PYTHONPATH: ${{ runner.temp }}/pi-stubs
          WW_DASH_SALT_KEY: ci
          WW_DB_USERNAME: weather
          WW_DB_PASSWORD: weather
          WW_DB_PROD: "false"
          WW_BACKUP_REQUIRE_MOUNT: "false"
        run: |
          # These tests drive a physical camera. Picamera2 is not installable here.
          poetry run pytest \
            --ignore=tests/camera/test_Camera.py \
            --ignore=tests/svc/test_CameraSvcTest.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test release build
        run: python3 scripts/build_release.py

      - name: Verify package structure
        run: |
          set -e
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          ARCHIVE="build/release/weatherwatch-${VERSION}.tar.gz"

          echo "Checking archive structure..."
          LISTING=$(tar -tzf "$ARCHIVE")
          echo "$LISTING" | head -20

          echo ""
          echo "Verifying required files..."
          require() {
            if ! echo "$LISTING" | grep -q "$1"; then
              echo "Missing $1"
              exit 1
            fi
            echo "✓ $2"
          }
          require "WeatherWatch/weatherwatch/sensor.py" "sensor.py found"
          require "WeatherWatch/weatherwatch/dashboard.py" "dashboard.py found"
          require "WeatherWatch/pyproject.toml" "pyproject.toml found"
          require "WeatherWatch/poetry.lock" "poetry.lock found"
          require "WeatherWatch/config/weatherwatch.yml" "weatherwatch.yml found"
          require "WeatherWatch/systemd/weatherwatch.service" "weatherwatch.service found"
          require "WeatherWatch/systemd/weatherdash.service" "weatherdash.service found"
          require "WeatherWatch/sql/schema/V1_0_0__initial.sql" "schema migration found"

      - name: Check archive size
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          ARCHIVE="build/release/weatherwatch-${VERSION}.tar.gz"

          SIZE=$(du -h "$ARCHIVE" | cut -f1)
          echo "Package size: $SIZE"

          # Fail if the package is unexpectedly large (> 1MB suggests dev files).
          SIZE_BYTES=$(stat -c%s "$ARCHIVE")
          if [ "$SIZE_BYTES" -gt 1048576 ]; then
            echo "Error: Package is too large ($SIZE). May include dev files."
            exit 1
          fi
          echo "✓ Package size is reasonable"

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weatherwatch-${{ steps.get_version.outputs.version }}-build
          path: build/release/weatherwatch-${{ steps.get_version.outputs.version }}.tar.gz
          retention-days: 7
